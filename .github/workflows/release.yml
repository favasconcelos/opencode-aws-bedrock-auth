name: Release

# Publishes to npm when a GitHub Release is published.
# Auth is npm trusted publishing (OIDC): no npm token is stored anywhere.
# The trusted publisher on npmjs.com must point at this exact file name (release.yml).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caches in release builds

      - name: Check npm supports trusted publishing
        run: |
          required=11.5.1
          current=$(npm --version)
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $current is older than $required, which trusted publishing needs"
            exit 1
          fi

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run fmt:check

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Pre-releases (e.g. v1.0.0-beta.1) go to the "next" dist-tag instead of "latest".
      - name: Publish
        run: npm publish ${{ github.event.release.prerelease && '--tag next' || '' }}
